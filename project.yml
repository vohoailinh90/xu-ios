# Sinh Xcode project: `brew install xcodegen && xcodegen generate`
# Định danh đã đặt theo chủ dự án (2026-10-10, docs/12): bundle ID com.vohoailinh90.xu, App Group group.com.vohoailinh90.xu.
# Muốn đổi thì đổi cho khớp ở cả: bundleIdPrefix, các PRODUCT_BUNDLE_IDENTIFIER, CFBundleURLName, App Group (2 chỗ) trong tệp này,
# `appGroupID` ở App/Shared/Persistence/SharedStore.swift và `productID` ở App/Shared/Settings/ProEntitlement.swift.
name: Xu
options:
  bundleIdPrefix: com.vohoailinh90
  developmentLanguage: vi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"   # chế độ ngôn ngữ Swift 5
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # tài khoản miễn phí: để trống, chọn Team trong Xcode (docs/12); tài khoản trả phí: điền Team ID
    CODE_SIGN_STYLE: Automatic
packages:
  XuCore:
    path: XuCore
targets:
  Xu:
    type: application
    platform: iOS
    sources:
      - App/Xu
      - App/Shared
      # Privacy manifest (docs/09): khai rõ là tài nguyên, không để XcodeGen đoán theo đuôi tệp.
      - path: App/Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: XuCore
      - target: XuWidgets
    info:
      path: App/Xu/Info.plist
      properties:
        CFBundleDisplayName: Xu
        CFBundleDevelopmentRegion: vi
        # Ngôn ngữ giao diện chọn trong app (docs/08); khai báo để hệ thống biết app có 3 thứ tiếng.
        CFBundleLocalizations: [vi, en, ja]
        UILaunchScreen: {}
        # Khoá Face ID (docs/02, S4). Bản dịch vi/en/ja ở App/Xu/InfoPlist.xcstrings.
        NSFaceIDUsageDescription: Xu dùng Face ID để mở khoá phần xem chi tiêu. Ô ghi chi tiêu không bao giờ bị khoá.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.vohoailinh90.xu
            CFBundleURLSchemes: [xu]
    entitlements:
      path: App/Xu/Xu.entitlements
      properties:
        com.apple.security.application-groups: [group.com.vohoailinh90.xu]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vohoailinh90.xu
  XuWidgets:
    type: app-extension
    platform: iOS
    sources:
      - App/XuWidgets
      - App/Shared
      - path: App/Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: XuCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: App/XuWidgets/Info.plist
      properties:
        CFBundleDisplayName: Xu
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: App/XuWidgets/XuWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.vohoailinh90.xu]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vohoailinh90.xu.widgets
schemes:
  Xu:
    build:
      targets:
        Xu: all
    run:
      config: Debug
