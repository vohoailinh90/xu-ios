# Sinh Xcode project: `brew install xcodegen && xcodegen generate`
# Nhớ đổi com.example và group.com.example.xu thành của bạn
# (App Group cũng phải đổi trong App/Shared/Persistence/SharedStore.swift).
name: Xu
options:
  bundleIdPrefix: com.example
  developmentLanguage: vi
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"   # chế độ ngôn ngữ Swift 5
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""   # điền Team ID của bạn
    CODE_SIGN_STYLE: Automatic
packages:
  XuCore:
    path: XuCore
targets:
  Xu:
    type: application
    platform: iOS
    sources:
      - App/Xu
      - App/Shared
    dependencies:
      - package: XuCore
      - target: XuWidgets
    info:
      path: App/Xu/Info.plist
      properties:
        CFBundleDisplayName: Xu
        CFBundleDevelopmentRegion: vi
        # Ngôn ngữ giao diện chọn trong app (docs/08); khai báo để hệ thống biết app có 3 thứ tiếng.
        CFBundleLocalizations: [vi, en, ja]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: com.example.xu
            CFBundleURLSchemes: [xu]
    entitlements:
      path: App/Xu/Xu.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.xu]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.xu
  XuWidgets:
    type: app-extension
    platform: iOS
    sources:
      - App/XuWidgets
      - App/Shared
    dependencies:
      - package: XuCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: App/XuWidgets/Info.plist
      properties:
        CFBundleDisplayName: Xu
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: App/XuWidgets/XuWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.xu]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.xu.widgets
schemes:
  Xu:
    build:
      targets:
        Xu: all
    run:
      config: Debug
