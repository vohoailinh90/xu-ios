name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  xucore-tests:
    name: XuCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run tests
        working-directory: XuCore
        run: swift test --parallel
